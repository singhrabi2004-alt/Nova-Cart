<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register - Nova Cart</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

</head>

<body>

    <header class="navbar">

        <div class="logo">
            <span>nova</span>
            <small>cart</small>
        </div>

        <a
            href="index.html"
            class="cart"
        >
            <i class="fa-solid fa-house"></i>
            <strong>Home</strong>
        </a>

    </header>


    <main class="auth-page">

        <div class="auth-box">

            <div class="auth-icon">
                <i class="fa-solid fa-user-plus"></i>
            </div>

            <h1>Create Account</h1>

            <p class="auth-subtitle">
                Create your Nova Cart account
            </p>


            <form id="register-form">

                <div class="input-group">
            
                    <label for="register-name">
                        Your Name
                    </label>
            
                    <div class="input-wrapper">
            
                        <i class="fa-solid fa-user"></i>
            
                        <input
                            type="text"
                            id="register-name"
                            placeholder="Enter your name"
                            required
                        >
            
                    </div>
            
                </div>
            
            
                <div class="input-group">
            
                    <label for="register-email">
                        Email
                    </label>
            
                    <div class="input-wrapper">
            
                        <i class="fa-solid fa-envelope"></i>
            
                        <input
                            type="email"
                            id="register-email"
                            placeholder="Enter your email"
                            required
                        >
            
                    </div>
            
                </div>
            
            
                <div class="input-group">
            
                    <label for="register-password">
                        Password
                    </label>
            
                    <div class="input-wrapper">
            
                        <i class="fa-solid fa-lock"></i>
            
                        <input
                            type="password"
                            id="register-password"
                            placeholder="Enter your password"
                            required
                        >
            
                        <button
                            type="button"
                            class="password-toggle"
                            id="toggle-register-password"
                            aria-label="Show password"
                        >
                            <i class="fa-solid fa-eye"></i>
                        </button>
            
                    </div>
            
                    <div class="password-rules">
            
                        <p>Password must contain:</p>
            
                        <ul>
                            <li id="length-rule">At least 8 characters</li>
                            <li id="uppercase-rule">At least 1 uppercase letter</li>
                            <li id="lowercase-rule">At least 1 lowercase letter</li>
                            <li id="number-rule">At least 1 number</li>
                            <li id="special-rule">At least 1 special character</li>
                        </ul>
            
                    </div>
            
                </div>
            
            
                <button
                    type="submit"
                    class="auth-btn"
                >
                    <i class="fa-solid fa-user-plus"></i>
                    Create Account
                </button>
            
            </form>


            <p
                id="register-message"
                class="auth-message"
            ></p>


            <p class="auth-switch">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </main>


    <script src="script.js?v=3"></script>

</body>

</html>
